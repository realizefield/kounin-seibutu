<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高認GAMBA 生物基礎 BL17 確認テスト</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;background:#f8fafc;color:#1e293b;line-height:1.9;font-size:16px}
.page-header{background:linear-gradient(135deg,#16a34a 0%,#15803d 100%);color:#fff;padding:2rem 1.5rem 1.5rem;text-align:center}
.page-header .unit-label{font-size:.85rem;opacity:.8;margin-bottom:.4rem}
.page-header h1{font-size:1.7rem;font-weight:800;margin-bottom:.5rem}
.page-header p{font-size:.95rem;opacity:.85}
.container{max-width:860px;margin:0 auto;padding:1.5rem 1rem 4rem}
.score-area{background:#fff;border:2px solid #16a34a;border-radius:12px;padding:1rem 1.5rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap}
.score-label{font-weight:700;color:#15803d;font-size:.95rem}
.score-num{font-size:1.6rem;font-weight:800;color:#15803d}
.progress-bar{flex:1;min-width:160px;height:12px;background:#e2e8f0;border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#16a34a,#15803d);border-radius:999px;transition:width .4s}
.question{background:#fff;border-radius:14px;border:1px solid #e2e8f0;margin-bottom:1.5rem;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.q-header{background:linear-gradient(90deg,#16a34a,#15803d);color:#fff;padding:.7rem 1.2rem;font-weight:800;font-size:.9rem}
.q-body{padding:1.2rem 1.4rem}
.q-text{font-size:.98rem;line-height:1.85;margin-bottom:1rem;font-weight:600}
.choices{display:flex;flex-direction:column;gap:.5rem}
.choice{display:flex;align-items:center;gap:.7rem;padding:.6rem 1rem;border-radius:8px;border:1.5px solid #e2e8f0;cursor:pointer;transition:all .2s;font-size:.92rem;background:#fafafa}
.choice:hover{border-color:#16a34a;background:#dcfce7}
.choice input[type=radio]{accent-color:#16a34a;width:16px;height:16px;flex-shrink:0}
.choice.correct-mark{background:#dcfce7;border-color:#16a34a;color:#15803d;font-weight:700}
.choice.wrong-mark{background:#fee2e2;border-color:#dc2626;color:#dc2626}
.exp-box{background:#f0f9ff;border:1.5px solid #7dd3fc;border-radius:8px;padding:.8rem 1rem;margin-top:.8rem;font-size:.88rem;line-height:1.75;display:none}
.exp-box.show{display:block}
.btn-row{display:flex;gap:.8rem;margin-top:1.2rem;flex-wrap:wrap}
.btn-check{padding:.6rem 1.5rem;background:#16a34a;color:#fff;border:none;border-radius:8px;font-weight:700;font-size:.92rem;cursor:pointer}
.btn-check:hover{background:#15803d}
.result-box{margin-top:.8rem;font-weight:700;font-size:.95rem;display:none}
.result-box.show{display:block}
.nav-links{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-top:2rem}
.btn-nav{padding:.65rem 1.4rem;border-radius:8px;font-weight:700;font-size:.92rem;text-decoration:none;transition:all .2s}
.btn-back{background:#fff;color:#16a34a;border:2px solid #16a34a}
.btn-back:hover{background:#dcfce7}
canvas{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;display:none}
@media(max-width:600px){.page-header h1{font-size:1.3rem}}
</style>
</head>
<body>
<header class="page-header">
  <div class="unit-label">高認GAMBA 生物基礎 ｜ BL17</div>
  <h1>✅ BL17 確認テスト｜エネルギーの流れ</h1>
  <p>全10問・選択肢を選んで答え合わせしましょう</p>
</header>
<canvas id="cv"></canvas>
<div class="container">
  <div class="score-area">
    <div><div class="score-label">正解数</div><div class="score-num" id="score-num">0</div></div>
    <div><div class="score-label">/ 10問</div></div>
    <div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%"></div></div>
  </div>
  <div id="q-area"></div>
  <div class="nav-links">
    <a href="BL17.html" class="btn-nav btn-back">← 解説に戻る</a>
    <a href="index.html" class="btn-nav btn-back">📋 メニュー</a>
  </div>
</div>
<script>
const COLOR="#16a34a",COLOR_DARK="#15803d";
const QS=[
  {
    "q": "植物が光合成で生産した有機物の総量を何というか。",
    "c": [
      "純生産量",
      "総生産量",
      "同化量",
      "呼吸量"
    ],
    "a": 1,
    "e": "総生産量は植物が光合成で固定した有機物の全量です。そこから呼吸量を引いたものが純生産量になります。"
  },
  {
    "q": "純生産量を正しく表した式はどれか。",
    "c": [
      "総生産量＋呼吸量",
      "総生産量÷呼吸量",
      "総生産量－呼吸量",
      "呼吸量－総生産量"
    ],
    "a": 2,
    "e": "純生産量＝総生産量－呼吸量です。純生産量は成長・被食・枯死などに使われる有機物量です。"
  },
  {
    "q": "動物の同化量（吸収量）を正しく表した式はどれか。",
    "c": [
      "摂食量＋不消化排出量",
      "摂食量－不消化排出量",
      "呼吸量＋被食量",
      "摂食量×エネルギー効率"
    ],
    "a": 1,
    "e": "同化量＝摂食量－不消化排出量（糞）。摂食したうち、実際に体内に吸収された量です。"
  },
  {
    "q": "植物の純生産量のうち草食動物に食べられた分を何というか。",
    "c": [
      "枯死量",
      "呼吸量",
      "被食量",
      "同化量"
    ],
    "a": 2,
    "e": "純生産量＝成長量＋被食量＋枯死量 の関係があります。被食量は次の栄養段階へ移動するエネルギー量です。"
  },
  {
    "q": "エネルギー効率（転送効率）の計算式として正しいものはどれか。",
    "c": [
      "自分の同化量÷前の栄養段階の同化量×100",
      "前の栄養段階の同化量÷自分の同化量×100",
      "自分の呼吸量÷摂食量×100",
      "純生産量÷総生産量×100"
    ],
    "a": 0,
    "e": "エネルギー効率(%)＝自分の同化量÷前の栄養段階の同化量×100。一般に10〜20%程度です。"
  },
  {
    "q": "総生産量5000、呼吸量2000のとき、純生産量はいくらか。",
    "c": [
      "7000",
      "3000",
      "2500",
      "1000"
    ],
    "a": 1,
    "e": "純生産量＝総生産量－呼吸量＝5000－2000＝3000です。"
  },
  {
    "q": "摂食量800、不消化排出量200のとき、同化量はいくらか。",
    "c": [
      "1000",
      "800",
      "600",
      "200"
    ],
    "a": 2,
    "e": "同化量＝摂食量－不消化排出量＝800－200＝600です。"
  },
  {
    "q": "同化量600、呼吸量400のとき、成長量はいくらか。",
    "c": [
      "1000",
      "400",
      "200",
      "600"
    ],
    "a": 2,
    "e": "成長量＝同化量－呼吸量＝600－400＝200です。成長量には被食量と死滅量が含まれます。"
  },
  {
    "q": "エネルギーの流れの特徴として正しいものはどれか。",
    "c": [
      "物質と同じように循環する",
      "一方向に流れ最終的に熱として失われる",
      "高次消費者ほど多くなる",
      "生態系内で保存される"
    ],
    "a": 1,
    "e": "エネルギーは生産者→消費者→分解者と一方向に流れ、各段階で呼吸熱として失われます。物質と違いエネルギーは循環しません。"
  },
  {
    "q": "一次消費者の同化量が1000、二次消費者の同化量が150のとき、エネルギー効率は何%か。",
    "c": [
      "5%",
      "10%",
      "15%",
      "20%"
    ],
    "a": 2,
    "e": "エネルギー効率＝150÷1000×100＝15%です。"
  }
];
let score=0,answered=0;

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b;}

function init(){
  const area=document.getElementById('q-area');
  QS.forEach((q,qi)=>{
    const order=shuffle([0,1,2,3]);
    let html=`<div class="question" id="q${qi}">
      <div class="q-header">問${qi+1} / ${QS.length}</div>
      <div class="q-body">
        <div class="q-text">${q.q}</div>
        <div class="choices" id="ch${qi}">`;
    order.forEach(ci=>{
      html+=`<label class="choice" id="c${qi}_${ci}">
        <input type="radio" name="q${qi}" value="${ci}" onchange="answer(${qi},${ci},${q.a})">
        ${q.c[ci]}
      </label>`;
    });
    html+=`</div>
        <div class="exp-box" id="exp${qi}">${q.e}</div>
        <div class="result-box" id="res${qi}"></div>
      </div>
    </div>`;
    area.innerHTML+=html;
  });
}

function answer(qi,ci,ans){
  const radios=document.querySelectorAll(`input[name="q${qi}"]`);
  radios.forEach(r=>r.disabled=true);
  const correct=(ci===ans);
  if(correct){
    score++;answered++;
    document.getElementById(`c${qi}_${ci}`).classList.add('correct-mark');
  }else{
    answered++;
    document.getElementById(`c${qi}_${ci}`).classList.add('wrong-mark');
    document.getElementById(`c${qi}_${ans}`).classList.add('correct-mark');
  }
  document.getElementById(`exp${qi}`).classList.add('show');
  const res=document.getElementById(`res${qi}`);
  res.classList.add('show');
  res.style.color=correct?COLOR_DARK:'#dc2626';
  res.textContent=correct?'✅ 正解！':'❌ 不正解';
  document.getElementById('score-num').textContent=score;
  document.getElementById('prog').style.width=(answered/QS.length*100)+'%';
  if(answered===QS.length&&score===QS.length)confetti();
}

function confetti(){
  const cv=document.getElementById('cv');
  cv.width=innerWidth;cv.height=innerHeight;cv.style.display='block';
  const ctx=cv.getContext('2d');
  const pts=Array.from({length:120},()=>[Math.random()*cv.width,-10,Math.random()*4+1,Math.random()*3-1.5,`hsl(${Math.random()*360},90%,55%)`,Math.random()*8+4]);
  let f=0;
  (function loop(){ctx.clearRect(0,0,cv.width,cv.height);pts.forEach(p=>{p[1]+=p[2];p[0]+=p[3];ctx.fillStyle=p[4];ctx.fillRect(p[0],p[1],p[5],p[5]*.6)});f++;if(f<200)requestAnimationFrame(loop);else{ctx.clearRect(0,0,cv.width,cv.height);cv.style.display='none';}})();
}
init();
</script>
</body>
</html>
