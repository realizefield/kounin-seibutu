<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高認GAMBA 生物基礎 BL07 穴埋めドリル</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;background:#f8fafc;color:#1e293b;line-height:1.9;font-size:16px}
.page-header{background:linear-gradient(135deg,#7c3aed 0%,#6d28d9 100%);color:#fff;padding:2rem 1.5rem 1.5rem;text-align:center}
.page-header .unit-label{font-size:.85rem;opacity:.8;margin-bottom:.4rem}
.page-header h1{font-size:1.7rem;font-weight:800;margin-bottom:.5rem}
.page-header p{font-size:.95rem;opacity:.85}
.container{max-width:860px;margin:0 auto;padding:1.5rem 1rem 4rem}
.score-bar{background:#fff;border:2px solid #7c3aed;border-radius:12px;padding:1rem 1.5rem;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.score-label{font-weight:700;color:#6d28d9;font-size:.95rem}
.score-num{font-size:1.6rem;font-weight:800;color:#6d28d9}
.progress-bar{flex:1;min-width:160px;height:12px;background:#e2e8f0;border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#6d28d9);border-radius:999px;transition:width .4s}
.section{background:#fff;border-radius:14px;border:1px solid #e2e8f0;margin-bottom:2rem;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.section-header{background:linear-gradient(90deg,#7c3aed,#6d28d9);color:#fff;padding:1rem 1.4rem;display:flex;align-items:center;gap:.8rem}
.section-header .badge{background:rgba(255,255,255,.25);border-radius:8px;padding:.2rem .65rem;font-weight:800;font-size:.9rem}
.section-header h2{font-size:1.05rem;font-weight:800}
.section-body{padding:1.5rem}
.q-card{border:1.5px solid #e2e8f0;border-radius:10px;padding:1.1rem 1.2rem;margin-bottom:1.2rem;background:#fafafa}
.q-card.answered-ok{border-color:#7c3aed;background:#ede9fe}
.q-card.answered-ng{border-color:#dc2626;background:#fee2e2}
.q-num{font-weight:800;color:#6d28d9;font-size:.85rem;margin-bottom:.5rem}
.q-text{font-size:.95rem;line-height:1.85;margin-bottom:.8rem}
.blank{display:inline-block;min-width:90px;border-bottom:2.5px solid #6d28d9;color:#6d28d9;font-weight:800;text-align:center;padding:.1rem .4rem;margin:0 .1rem;cursor:pointer;transition:all .2s;background:transparent;vertical-align:bottom;font-size:.95rem}
.blank.filled{background:#ede9fe;border-color:#7c3aed;border-radius:4px;border-style:solid;border-width:1.5px}
.blank.correct{background:#ede9fe;border-color:#7c3aed;color:#6d28d9}
.blank.wrong{background:#fee2e2;border-color:#dc2626;color:#dc2626}
.word-bank{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem;padding:.8rem;background:#f1f5f9;border-radius:8px}
.word-btn{padding:.35rem .85rem;background:#fff;border:2px solid #7c3aed;border-radius:999px;cursor:pointer;font-weight:700;font-size:.88rem;color:#6d28d9;transition:all .2s;user-select:none}
.word-btn:hover{background:#ede9fe}
.word-btn.selected-word{background:#7c3aed;color:#fff}
.word-btn.used{opacity:.35;cursor:not-allowed;background:#e2e8f0;border-color:#94a3b8;color:#64748b}
.btn-row{display:flex;gap:.8rem;margin-top:1rem;flex-wrap:wrap}
.btn-check{padding:.6rem 1.5rem;background:#7c3aed;color:#fff;border:none;border-radius:8px;font-weight:700;font-size:.92rem;cursor:pointer}
.btn-check:hover{background:#6d28d9}
.btn-reset{padding:.6rem 1.5rem;background:#fff;color:#7c3aed;border:2px solid #7c3aed;border-radius:8px;font-weight:700;font-size:.92rem;cursor:pointer}
.result-msg{margin-top:.8rem;font-weight:700;font-size:.95rem;display:none}
.result-msg.show{display:block}
.nav-links{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-top:2rem}
.btn-nav{padding:.65rem 1.4rem;border-radius:8px;font-weight:700;font-size:.92rem;text-decoration:none;transition:all .2s}
.btn-back{background:#fff;color:#7c3aed;border:2px solid #7c3aed}
.btn-back:hover{background:#ede9fe}
canvas{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;display:none}
@media(max-width:600px){.page-header h1{font-size:1.3rem}}
</style>
</head>
<body>
<header class="page-header">
  <div class="unit-label">高認GAMBA 生物基礎 ｜ BL07</div>
  <h1>✏️ BL07 穴埋めドリル｜遺伝情報の発現</h1>
  <p>語群から言葉を選んで空欄をうめましょう</p>
</header>
<canvas id="cv"></canvas>
<div class="container">
  <div class="score-bar">
    <div><div class="score-label">正解数</div><div class="score-num" id="score-num">0</div></div>
    <div><div class="score-label">問題数</div><div class="score-num" id="total-num">0</div></div>
    <div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%"></div></div>
  </div>
  <div id="drill-area"></div>
  <div class="nav-links">
    <a href="BL07.html" class="btn-nav btn-back">← 解説に戻る</a>
    <a href="index.html" class="btn-nav btn-back">📋 メニュー</a>
  </div>
</div>
<script>
const COLOR="#7c3aed",COLOR_DARK="#6d28d9",COLOR_LIGHT="#ede9fe";
const DATA=[
  {
    "badge": "S1",
    "title": "RNAとは",
    "questions": [
      {
        "text": "RNAはリボ___（略称RNA）とも呼ばれる。",
        "blanks": [
          {
            "ans": "核酸"
          }
        ]
      },
      {
        "text": "RNAの糖は___であり、DNAの糖（デオキシリボース）とは異なる。",
        "blanks": [
          {
            "ans": "リボース"
          }
        ]
      },
      {
        "text": "RNAの塩基はアデニン（A）・___（U）・グアニン（G）・シトシン（C）の4種類。",
        "blanks": [
          {
            "ans": "ウラシル"
          }
        ]
      },
      {
        "text": "RNAは___本鎖でできており、DNAの___本鎖とは異なる。",
        "blanks": [
          {
            "ans": "1"
          },
          {
            "ans": "2"
          }
        ]
      }
    ]
  },
  {
    "badge": "S2",
    "title": "転写（DNA→mRNA）",
    "questions": [
      {
        "text": "DNAの遺伝情報をもとにmRNAを合成する過程を___という。",
        "blanks": [
          {
            "ans": "転写"
          }
        ]
      },
      {
        "text": "転写は細胞の___（細胞核）の中で行われる。",
        "blanks": [
          {
            "ans": "核"
          }
        ]
      },
      {
        "text": "転写によって作られるRNAを___RNAという。",
        "blanks": [
          {
            "ans": "メッセンジャー（m）"
          }
        ]
      },
      {
        "text": "DNAの塩基Aに対してRNAでは___が対応する（TではなくUになる）。",
        "blanks": [
          {
            "ans": "U（ウラシル）"
          }
        ]
      }
    ]
  },
  {
    "badge": "S3",
    "title": "翻訳（mRNA→タンパク質）",
    "questions": [
      {
        "text": "mRNAの塩基配列をもとにタンパク質を合成する過程を___という。",
        "blanks": [
          {
            "ans": "翻訳"
          }
        ]
      },
      {
        "text": "翻訳は細胞質にある___で行われる。",
        "blanks": [
          {
            "ans": "リボソーム"
          }
        ]
      },
      {
        "text": "アミノ酸を運んでリボソームに届けるRNAを___RNAという。",
        "blanks": [
          {
            "ans": "転移（t）"
          }
        ]
      },
      {
        "text": "mRNAの連続した3つの塩基（___）が1つのアミノ酸を指定する。",
        "blanks": [
          {
            "ans": "コドン"
          }
        ]
      },
      {
        "text": "翻訳でつなぎ合わされる物質は___であり、これがタンパク質の材料になる。",
        "blanks": [
          {
            "ans": "アミノ酸"
          }
        ]
      }
    ]
  },
  {
    "badge": "S4",
    "title": "セントラルドグマ・パフ",
    "questions": [
      {
        "text": "DNA→RNA→タンパク質という遺伝情報の流れを___という。",
        "blanks": [
          {
            "ans": "セントラルドグマ"
          }
        ]
      },
      {
        "text": "ショウジョウバエのだ腺染色体に見られる膨らみ（___）は、遺伝子が活発に転写されている部位である。",
        "blanks": [
          {
            "ans": "パフ"
          }
        ]
      },
      {
        "text": "パフは特定の発生段階・組織でのみ出現し、___（遺伝子発現）が時間・場所によって調節されていることを示す。",
        "blanks": [
          {
            "ans": "転写"
          }
        ]
      }
    ]
  }
];

let totalQ=0,correctQ=0,selectedWord=null,selectedWordBtn=null;

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b;}

function init(){
  const area=document.getElementById('drill-area');
  area.innerHTML='';
  totalQ=0;correctQ=0;
  DATA.forEach((sec,si)=>{
    const div=document.createElement('div');
    div.className='section';
    let words=[];
    sec.questions.forEach(q=>q.blanks.forEach(b=>words.push(b.ans)));
    words=shuffle(words);
    let html=`<div class="section-header"><span class="badge">${sec.badge}</span><h2>${sec.title}</h2></div><div class="section-body">`;
    sec.questions.forEach((q,qi)=>{
      totalQ+=q.blanks.length;
      let txt=q.text;
      q.blanks.forEach((b,bi)=>{
        txt=txt.replace('___',`<span class="blank" id="b_${si}_${qi}_${bi}" data-ans="${b.ans}" onclick="fillBlank(this)">　　　</span>`);
      });
      html+=`<div class="q-card" id="qc_${si}_${qi}"><div class="q-num">問${qi+1}</div><div class="q-text">${txt}</div></div>`;
    });
    html+=`<div class="word-bank" id="pool_${si}">`;
    words.forEach((w,wi)=>html+=`<span class="word-btn" id="wp_${si}_${wi}" onclick="selectWord(this,'${w}')">${w}</span>`);
    html+=`</div><div class="btn-row"><button class="btn-check" onclick="checkSection(${si})">✅ 採点</button><button class="btn-reset" onclick="resetSection(${si})">🔄 リセット</button></div>`;
    html+=`<div class="result-msg" id="res_${si}"></div></div>`;
    div.innerHTML=html;
    area.appendChild(div);
  });
  document.getElementById('total-num').textContent=totalQ;
  updateProg();
}

function selectWord(btn,word){
  if(btn.classList.contains('used'))return;
  if(selectedWordBtn)selectedWordBtn.classList.remove('selected-word');
  selectedWord=word;selectedWordBtn=btn;
  btn.classList.add('selected-word');
}

function fillBlank(span){
  if(!selectedWord)return;
  // 前の値を語群に戻す
  const prev=span.dataset.filled;
  if(prev){
    const pool=span.closest('.section-body').querySelector('.word-bank');
    const used=[...pool.querySelectorAll('.word-btn.used')].find(b=>b.textContent===prev);
    if(used)used.classList.remove('used');
  }
  span.textContent=selectedWord;
  span.dataset.filled=selectedWord;
  span.classList.add('filled');
  span.classList.remove('correct','wrong');
  selectedWordBtn.classList.add('used');
  selectedWordBtn.classList.remove('selected-word');
  selectedWord=null;selectedWordBtn=null;
}

function checkSection(si){
  const sec=DATA[si];
  let ok=0,tot=0;
  sec.questions.forEach((q,qi)=>{
    q.blanks.forEach((b,bi)=>{
      tot++;
      const span=document.getElementById(`b_${si}_${qi}_${bi}`);
      if(span.dataset.filled===b.ans){ok++;span.classList.add('correct');span.classList.remove('wrong');}
      else{span.classList.add('wrong');span.classList.remove('correct');span.textContent=b.ans;}
    });
  });
  correctQ+=ok;
  const res=document.getElementById(`res_${si}`);
  res.classList.add('show');
  if(ok===tot){res.style.color=COLOR_DARK;res.textContent=`✅ 全問正解！（${ok}/${tot}）`;if(si===DATA.length-1)confetti();}
  else{res.style.color='#dc2626';res.textContent=`${ok}/${tot} 正解。不正解は正解を表示しました。`;}
  updateProg();
}

function resetSection(si){
  const sec=DATA[si];
  sec.questions.forEach((q,qi)=>{
    q.blanks.forEach((b,bi)=>{
      const span=document.getElementById(`b_${si}_${qi}_${bi}`);
      span.textContent='　　　';span.dataset.filled='';
      span.classList.remove('filled','correct','wrong');
    });
  });
  const pool=document.getElementById(`pool_${si}`);
  pool.querySelectorAll('.word-btn').forEach(b=>b.classList.remove('used','selected-word'));
  document.getElementById(`res_${si}`).classList.remove('show');
  correctQ=0;updateProg();
}

function updateProg(){
  const pct=totalQ>0?Math.round(correctQ/totalQ*100):0;
  document.getElementById('prog').style.width=pct+'%';
  document.getElementById('score-num').textContent=correctQ;
}

function confetti(){
  const cv=document.getElementById('cv');
  cv.width=innerWidth;cv.height=innerHeight;cv.style.display='block';
  const ctx=cv.getContext('2d');
  const pts=Array.from({length:120},()=>[Math.random()*cv.width,-10,Math.random()*4+1,Math.random()*3-1.5,`hsl(${Math.random()*360},90%,55%)`,Math.random()*8+4]);
  let f=0;
  (function loop(){ctx.clearRect(0,0,cv.width,cv.height);pts.forEach(p=>{p[1]+=p[2];p[0]+=p[3];ctx.fillStyle=p[4];ctx.fillRect(p[0],p[1],p[5],p[5]*.6)});f++;if(f<200)requestAnimationFrame(loop);else{ctx.clearRect(0,0,cv.width,cv.height);cv.style.display='none';}})();
}
init();
</script>
</body>
</html>
