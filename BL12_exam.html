<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BL12 確認問題 — 腎臓のはたらき</title>
<style>
:root{--pri:#0e7490;--pri-l:#a5f3fc;--pri-ll:#f0fdff;--ok:#16a34a;--ok-bg:#dcfce7;--ng:#dc2626;--ng-bg:#fee2e2;--ink:#1f2937;--gray:#6b7280;--gray-l:#f3f4f6;--border:#e5e7eb;--bg:#f0fdff;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.07);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;padding-bottom:60px;}
.page-hd{background:linear-gradient(135deg,#075985,#0e7490,#0891b2);color:#fff;padding:26px 16px 22px;text-align:center;position:relative;overflow:hidden;}
.hd-label{font-size:.72rem;letter-spacing:.18em;opacity:.8;margin-bottom:5px;}
.hd-title{font-size:1.35rem;font-weight:800;margin-bottom:3px;}
.hd-sub{font-size:.82rem;opacity:.75;}
.back-btn{position:absolute;left:14px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.18);border:none;color:#fff;padding:6px 12px;border-radius:8px;font-size:.8rem;cursor:pointer;text-decoration:none;}
.prog-wrap{background:#fff;border-bottom:1px solid var(--border);padding:10px 16px;position:sticky;top:0;z-index:100;}
.prog-info{display:flex;justify-content:space-between;font-size:.78rem;color:var(--gray);margin-bottom:5px;}
.prog-bar{height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--pri),#0891b2);width:0%;transition:width .4s;}
.wrap{max-width:700px;margin:0 auto;padding:20px 16px;}
.q-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow);}
.q-hd{padding:14px 16px 10px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start;}
.q-badge{background:var(--pri);color:#fff;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:20px;flex-shrink:0;margin-top:2px;}
.q-text{font-size:.95rem;font-weight:500;line-height:1.6;}
.opts{padding:10px 14px 12px;display:flex;flex-direction:column;gap:7px;}
.opt{border:1.5px solid var(--border);border-radius:9px;padding:10px 13px;font-size:.88rem;cursor:pointer;background:#fff;text-align:left;transition:all .15s;display:flex;align-items:center;gap:8px;}
.opt:hover:not(:disabled){border-color:var(--pri);background:var(--pri-ll);}
.opt-lbl{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex-shrink:0;}
.opt.correct{border-color:var(--ok);background:var(--ok-bg);}
.opt.correct .opt-lbl{background:var(--ok);border-color:var(--ok);color:#fff;}
.opt.wrong{border-color:var(--ng);background:var(--ng-bg);}
.opt.wrong .opt-lbl{background:var(--ng);border-color:var(--ng);color:#fff;}
.explain{margin:0 14px 12px;padding:10px 12px;border-radius:8px;font-size:.85rem;line-height:1.65;display:none;}
.explain.show{display:block;}
.explain.ok-ex{background:var(--ok-bg);border-left:3px solid var(--ok);}
.explain.ng-ex{background:var(--ng-bg);border-left:3px solid var(--ng);}
.final-panel{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 20px;text-align:center;margin-top:8px;display:none;}
.final-panel.show{display:block;}
.final-score{font-size:2.6rem;font-weight:800;color:var(--pri);}
.final-total{font-size:.95rem;color:var(--gray);margin:4px 0 14px;}
.final-msg{font-size:.95rem;margin-bottom:18px;}
.final-btn{background:linear-gradient(135deg,var(--pri),#0891b2);color:#fff;border:none;padding:11px 28px;border-radius:24px;font-size:.9rem;font-weight:700;cursor:pointer;}
canvas#confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;display:none;}
/* ページ間ナビ */
.page-nav{display:flex;gap:6px;background:#fff;border-bottom:1px solid var(--border);
  padding:8px 12px;position:sticky;top:0;z-index:200;flex-wrap:wrap;}
.pnav-btn{flex:1;min-width:60px;padding:6px 4px;border:1.5px solid var(--border);
  border-radius:8px;font-size:.75rem;font-weight:700;text-align:center;
  text-decoration:none;color:var(--ink);background:#fff;white-space:nowrap;}
.pnav-btn.active{background:var(--pri);color:#fff;border-color:var(--pri);}
.pnav-btn:hover:not(.active){border-color:var(--pri);background:var(--pri-ll);}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="page-hd">
  <a class="back-btn" href="BL12.html">← 解説へ</a>
  <div class="hd-label">BL-12 確認問題</div>
  <div class="hd-title">腎臓のはたらき</div>
  <div class="hd-sub">全10問 — 入試形式で実力確認</div>
</div>
<div class="page-nav">
  <a class="pnav-btn" href="BL12.html">📖 解説</a>
  <a class="pnav-btn" href="BL12_drill.html">✏️ ドリル</a>
  <a class="pnav-btn" href="BL12_check.html">📝 確認テスト</a>
  <span class="pnav-btn active">📋 確認問題</span>
</div>
<div class="prog-wrap">
  <div class="prog-info"><span id="prog-text">0 / 10 問回答済み</span><span id="score-text"></span></div>
  <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
</div>
<div class="wrap" id="qlist"></div>
<script>
const QS=[
  {q:'腎臓のはたらきについて述べた文として正しいのはどれか。',opts:['糸球体では血球もタンパク質もろ過される','ボーマンのうにこし出された液を原尿という','グルコースは腎臓でろ過されない','細尿管では尿素が100%再吸収される'],ans:1,ex:'<b>ボーマンのうにこし出された液＝原尿</b>が正解。①血球・タンパク質はろ過されない。③グルコースはろ過されるが100%再吸収される。④尿素はほとんど再吸収されない。'},
  {q:'腎小体（マルピーギ小体）の説明として正しいのはどれか。',opts:['細尿管と集合管を合わせた構造','糸球体とボーマンのうを合わせた構造','腎単位（ネフロン）の別名','ボーマンのうのみを指す'],ans:1,ex:'<b>腎小体（マルピーギ小体）＝糸球体＋ボーマンのう</b>。腎単位（ネフロン）は腎小体＋細尿管。'},
  {q:'次の文章中の（ア）（イ）にあてはまる語の組み合わせとして正しいのはどれか。「腎臓では、血液中の成分のうち（ア）などの大きな分子はろ過されず、（イ）などの小さな分子はボーマンのうにこし出される。」',opts:['ア：尿素　イ：タンパク質','ア：タンパク質　イ：グルコース','ア：グルコース　イ：タンパク質','ア：無機塩類　イ：血球'],ans:1,ex:'<b>タンパク質（大分子）はろ過されない</b>、<b>グルコース（小分子）はろ過される</b>（その後100%再吸収）。'},
  {q:'健康なヒトの尿に含まれないものはどれか。',opts:['尿素','無機塩類','グルコース','水'],ans:2,ex:'<b>グルコース</b>は細尿管で100%再吸収されるため、健康な人の尿には含まれません。尿素は再吸収されにくく尿に濃縮されます。'},
  {q:'尿素の血しょう中の濃度は0.03%、尿中の濃度は2.0%である。尿素の濃縮率として正しいのはどれか。',opts:['約0.015倍','約1.5倍','約67倍','約150倍'],ans:2,ex:'濃縮率＝尿中の濃度÷血しょう中の濃度＝2.0÷0.03≒<b>67倍</b>。'},
  {q:'グルコースの濃縮率が0であることは何を意味するか。',opts:['グルコースはろ過されない','グルコースは100%再吸収される','グルコースは尿に大量に含まれる','グルコースは細尿管で分解される'],ans:1,ex:'濃縮率が0＝尿に出てこない＝<b>100%再吸収</b>されることを意味します（ろ過はされますが全て取り戻す）。'},
  {q:'次の文章の空欄に入る語句の組み合わせとして正しいのはどれか。「体液の塩類濃度が上昇すると、脳下垂体後葉から（A）が分泌され、腎臓での（B）の再吸収が促進される。」',opts:['A：鉱質コルチコイド　B：Na⁺','A：バソプレシン　B：水分','A：インスリン　B：グルコース','A：バソプレシン　B：Na⁺'],ans:1,ex:'<b>バソプレシン</b>（脳下垂体後葉）→<b>水分の再吸収</b>を促進。鉱質コルチコイド（副腎皮質）→Na⁺の再吸収を促進。'},
  {q:'副腎皮質から分泌される鉱質コルチコイドの説明として正しいのはどれか。',opts:['腎臓での水分の再吸収を促進する','腎臓でのNa⁺の再吸収を促進する','血糖値を下げる','肝臓でのグリコーゲン合成を促進する'],ans:1,ex:'<b>鉱質コルチコイド</b>（副腎皮質）は細尿管での<b>Na⁺（ナトリウムイオン）の再吸収</b>を促進します。'},
  {q:'海水魚の体液濃度調節について正しいのはどれか。',opts:['えらで塩類を吸収し、大量の薄い尿を出す','大量の海水を飲んで水分を吸収し、えらから塩分を排出する','体液濃度が海水より高いため水が体内に流入する','少量の尿しか出さず、塩分は体内に蓄積される'],ans:1,ex:'海水魚：体液1%＜海水3.5%なので水が<b>体外へ流出</b>する。対策として<b>大量の海水を飲み水分を吸収</b>し、余分な塩分はえら・腎臓から排出する。尿は少量・体液と同じ濃度。'},
  {q:'腎臓のはたらきについて正しい組み合わせはどれか。',opts:['①ろ過：糸球体　②再吸収：細尿管　③尿の蓄積：集合管','①ろ過：ボーマンのう　②再吸収：糸球体　③尿の蓄積：腎う','①ろ過：細尿管　②再吸収：ボーマンのう　③尿の蓄積：集合管','①ろ過：糸球体　②再吸収：細尿管　③尿の蓄積：ぼうこう'],ans:0,ex:'<b>糸球体でろ過→細尿管で再吸収→集合管に尿が集まる→腎う→輸尿管→ぼうこう</b>の流れが正確に理解できているかが問われます。'}
];
const LB=['ア','イ','ウ','エ'];
let answered=new Array(QS.length).fill(false);
let correct=new Array(QS.length).fill(false);
function build(){
  const list=document.getElementById('qlist');list.innerHTML='';
  QS.forEach((q,i)=>{
    const card=document.createElement('div');card.className='q-card';card.id='qcard'+i;
    card.innerHTML='<div class="q-hd"><span class="q-badge">Q'+(i+1)+'</span><div class="q-text">'+q.q+'</div></div><div class="opts">'+q.opts.map((o,j)=>'<button class="opt" onclick="pick('+i+','+j+')"><span class="opt-lbl">'+LB[j]+'</span>'+o+'</button>').join('')+'</div><div class="explain" id="ex'+i+'"></div>';
    list.appendChild(card);
  });
  const panel=document.createElement('div');panel.className='final-panel';panel.id='final-panel';
  panel.innerHTML='<div class="final-score" id="final-score">0</div><div class="final-total">/ '+QS.length+' 問正解</div><div class="final-msg" id="final-msg"></div><button class="final-btn" onclick="retry()">もう一度挑戦</button>';
  list.appendChild(panel);
}
function pick(qi,oi){
  if(answered[qi])return;
  answered[qi]=true;correct[qi]=(oi===QS[qi].ans);
  document.querySelectorAll('#qcard'+qi+' .opt').forEach((o,j)=>{
    o.disabled=true;
    if(j===QS[qi].ans)o.classList.add('correct');
    else if(j===oi)o.classList.add('wrong');
  });
  const ex=document.getElementById('ex'+qi);
  ex.innerHTML=QS[qi].ex;ex.className='explain show '+(correct[qi]?'ok-ex':'ng-ex');
  updateProg();if(answered.every(Boolean))showFinal();
}
function updateProg(){
  const done=answered.filter(Boolean).length;const ok=correct.filter(Boolean).length;
  document.getElementById('prog-text').textContent=done+' / '+QS.length+' 問回答済み';
  document.getElementById('score-text').textContent=done?'正解 '+ok+' 問':'';
  document.getElementById('prog-fill').style.width=(done/QS.length*100)+'%';
}
function showFinal(){
  const ok=correct.filter(Boolean).length;
  document.getElementById('final-panel').className='final-panel show';
  document.getElementById('final-score').textContent=ok;
  const msgs=[[QS.length,'🎉 全問正解！腎臓のはたらきを完璧にマスター！'],[Math.floor(QS.length*.8),'👏 よくできました！'],[Math.floor(QS.length*.5),'✅ もう少し！解説を読んで再挑戦。'],[0,'📚 解説ページで復習しましょう。']];
  document.getElementById('final-msg').textContent=msgs.find(([t])=>ok>=t)[1];
  if(ok===QS.length)fireConfetti();
}
function retry(){answered.fill(false);correct.fill(false);build();updateProg();window.scrollTo({top:0,behavior:'smooth'});}
function fireConfetti(){
  const cv=document.getElementById('confetti');cv.width=window.innerWidth;cv.height=window.innerHeight;cv.style.display='block';
  const ctx=cv.getContext('2d');const cols=['#0e7490','#e74c3c','#f1c40f','#2ecc71','#0891b2','#fff'];const pts=[];
  for(let i=0;i<140;i++)pts.push({x:Math.random()*cv.width,y:-Math.random()*cv.height*.4,s:Math.random()*7+4,c:cols[i%cols.length],sp:2+Math.random()*2.5,vx:(Math.random()-.5)*2});
  let f=0;(function loop(){ctx.clearRect(0,0,cv.width,cv.height);pts.forEach(p=>{p.y+=p.sp;p.x+=p.vx;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s);if(p.y>cv.height)p.y=-20;});f++;if(f<320)requestAnimationFrame(loop);else cv.style.display='none';})();
}
build();updateProg();
</script>
</body>
</html>
